name: LEAF chat interface checks

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'tests/**'
      - '.github/workflows/leaf-ui-tests.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  chat-context:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify secure LEAF chat history and preview boundaries
        run: node --test tests/*.test.mjs
